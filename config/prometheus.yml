# Prometheus 配置文件 — ContentOpsMind

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "contentopsmind"
    environment: "production"

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # ContentOpsMind 应用指标
  - job_name: "contentopsmind-app"
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: "contentopsmind"
    scrape_interval: 10s
    metrics_path: "/metrics"

  # Prometheus 自监控
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
